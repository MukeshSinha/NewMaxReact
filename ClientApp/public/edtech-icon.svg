<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Card Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Glass Inner Rim -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" />

  <!-- Modern Stylized M for MaxPay -->
  <g filter="url(#glow)">
    <path d="M 128 360 L 128 170 C 128 152 142 138 160 138 C 172 138 183 145 188 156 L 256 270 L 324 156 C 329 145 340 138 352 138 C 370 138 384 152 384 170 L 384 360 C 384 373 373 384 360 384 C 347 384 336 373 336 360 L 336 230 L 278 326 C 268 342 244 342 234 326 L 176 230 L 176 360 C 176 373 165 384 152 384 C 139 384 128 373 128 360 Z" fill="url(#accentGrad)" />

    <!-- Currency / Lightning Flash Symbol -->
    <path d="M 256 362 L 296 300 L 270 300 L 286 240 L 226 312 L 250 312 Z" fill="#38bdf8" />
  </g>

  <!-- Live Status Badge Dot -->
  <circle cx="390" cy="122" r="18" fill="#10b981" />
  <circle cx="390" cy="122" r="8" fill="#ffffff" opacity="0.9" />
</svg>